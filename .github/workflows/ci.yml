name: GOA CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'services/gateway/**'

            speaking:
              - 'services/speaking/**'

            rag:
              - 'services/rag/**'

            user:
              - 'services/user/**'

            orchestration:
              - 'services/orchestration/**'

            writing:
              - 'services/writing/**'

            exam:
              - 'services/exam/**'

            notification:
              - 'services/notification/**'

      - id: matrix
        uses: actions/github-script@v7
        env:
          GATEWAY: ${{ steps.changes.outputs.gateway }}
          SPEAKING: ${{ steps.changes.outputs.speaking }}
          RAG: ${{ steps.changes.outputs.rag }}
          USER: ${{ steps.changes.outputs.user }}
          ORCHESTRATION: ${{ steps.changes.outputs.orchestration }}
          WRITING: ${{ steps.changes.outputs.writing }}
          EXAM: ${{ steps.changes.outputs.exam }}
          NOTIFICATION: ${{ steps.changes.outputs.notification }}
        with:
          script: |
            const matrix = [];

            // Go Services
            if (process.env.GATEWAY === 'true')
              matrix.push({ service: 'gateway', language: 'go' });

            if (process.env.SPEAKING === 'true')
              matrix.push({ service: 'speaking', language: 'go' });

            // Python Services
            if (process.env.RAG === 'true')
              matrix.push({ service: 'rag', language: 'python' });

            if (process.env.ORCHESTRATION === 'true')
              matrix.push({ service: 'orchestration', language: 'python' });

            if (process.env.WRITING === 'true')
              matrix.push({ service: 'writing', language: 'python' });

            if (process.env.EXAM === 'true')
              matrix.push({ service: 'exam', language: 'python' });

            // Node Services
            if (process.env.USER === 'true')
              matrix.push({ service: 'user', language: 'node' });

            if (process.env.NOTIFICATION === 'true')
              matrix.push({ service: 'notification', language: 'node' });

            core.setOutput('matrix', JSON.stringify(matrix));

  test-services:
    name: Test ${{ matrix.service }}
    needs: detect-changes

    if: needs.detect-changes.outputs.matrix != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #########################################################
      # GO SERVICES
      #########################################################

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod

      - name: Cache Go Modules
        if: matrix.language == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/go.sum', matrix.service)) }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.service }}-

      - name: Run golangci-lint
        if: matrix.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/${{ matrix.service }}
          args: --timeout=3m
          skip-cache: true

      - name: Run Go Tests
        if: matrix.language == 'go'
        run: |
          go test ./... -v

      #########################################################
      # PYTHON SERVICES
      #########################################################

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip
        if: matrix.language == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/requirements.txt', matrix.service)) }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.service }}-

      - name: Install Python Dependencies
        if: matrix.language == 'python'
        run: |
          pip install -r requirements.txt

      - name: Install Ruff
        if: matrix.language == 'python'
        run: |
          pip install ruff

      - name: Run Ruff
        if: matrix.language == 'python'
        run: |
          ruff check .

      - name: Run Pytest With Coverage
        if: matrix.language == 'python'
        run: |
          pytest --cov=. \
                 --cov-report=xml \
                 --cov-fail-under=70

      #########################################################
      # TYPESCRIPT / NODE SERVICES
      #########################################################

      - name: Setup Node
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        if: matrix.language == 'node'
        run: |
          npm ci

      - name: Run ESLint
        if: matrix.language == 'node'
        run: |
          npm run lint

      - name: Run Jest Coverage
        if: matrix.language == 'node'
        run: |
          npm run test:cov

      #########################################################
      # COVERAGE ARTIFACTS
      #########################################################

      - name: Upload Coverage Reports
        if: matrix.language != 'go'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/coverage
            services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
