name: GOA CI

on:
  pull_request:
    branches:
      - main
      - dev
permissions:
  contents: read
  pull-requests: read
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'services/gateway/**'
            speaking:
              - 'services/speaking/**'
            rag:
              - 'services/rag/**'
            user:
              - 'services/user/**'
            orchestration:
              - 'services/orchestration/**'
            writing:
              - 'services/writing/**'
            exam:
              - 'services/exam/**'
            notification:
              - 'services/notification/**'
            ingestion:
              - 'services/ingestion/**'

      - id: matrix
        uses: actions/github-script@v7
        env:
          GATEWAY: ${{ steps.changes.outputs.gateway }}
          SPEAKING: ${{ steps.changes.outputs.speaking }}
          RAG: ${{ steps.changes.outputs.rag }}
          USER: ${{ steps.changes.outputs.user }}
          ORCHESTRATION: ${{ steps.changes.outputs.orchestration }}
          WRITING: ${{ steps.changes.outputs.writing }}
          EXAM: ${{ steps.changes.outputs.exam }}
          NOTIFICATION: ${{ steps.changes.outputs.notification }}
          INGESTION: ${{ steps.changes.outputs.ingestion }}
        with:
          script: |
            const matrix = [];

            if (process.env.GATEWAY === 'true')
              matrix.push({ service: 'gateway', language: 'go' });

            if (process.env.SPEAKING === 'true')
              matrix.push({ service: 'speaking', language: 'go' });

            if (process.env.RAG === 'true')
              matrix.push({ service: 'rag', language: 'python' });

            if (process.env.ORCHESTRATION === 'true')
              matrix.push({ service: 'orchestration', language: 'python' });

            if (process.env.WRITING === 'true')
              matrix.push({ service: 'writing', language: 'python' });

            if (process.env.EXAM === 'true')
              matrix.push({ service: 'exam', language: 'python' });

            if (process.env.USER === 'true')
              matrix.push({ service: 'user', language: 'node' });

            if (process.env.NOTIFICATION === 'true')
              matrix.push({ service: 'notification', language: 'node' });

            if (process.env.INGESTION === 'true')
              matrix.push({ service: 'ingestion', language: 'python' });

            core.setOutput("matrix", JSON.stringify(matrix));

  test-services:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'

    runs-on: ubuntu-latest

    # Without this the job inherits GitHub's 6-hour default, so a single test
    # that blocks (see the SQS consumer's queue-URL retry loop) holds a runner
    # for the rest of the day instead of failing. This is the backstop; the
    # per-test --timeout below is what actually names the culprit.
    timeout-minutes: 20

    # [RESILIENCE FIX 3]: Spin up Postgres alongside Redis for global DB mocks
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      ####################################################
      # GO
      ####################################################

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod

      - name: Cache Go
        if: matrix.language == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles(format('services/{0}/go.sum', matrix.service)) }}

      - name: Go Lint
        if: matrix.language == 'go'
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/${{ matrix.service }}

      - name: Go Tests
        if: matrix.language == 'go'
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
        run: go test ./... -v

      ####################################################
      # PYTHON
      ####################################################

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Pip
        if: matrix.language == 'python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles(format('services/{0}/requirements.txt', matrix.service)) }}

      - name: Install Dependencies
        if: matrix.language == 'python'
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov pytest-timeout

      - name: Ruff
        if: matrix.language == 'python'
        continue-on-error: true
        run: ruff check .

      - name: Run Tests
        if: matrix.language == 'python'
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          OPENAI_API_KEY: dummy-key
          ANTHROPIC_API_KEY: dummy-key
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_GATEWAY_URL: redis://127.0.0.1:6379/0
          PYTHONPATH: ${{ github.workspace }}/packages/contracts/py:${{ github.workspace }}/packages/security/py:${{ github.workspace }}/packages/pricing/py
        # [RESILIENCE FIX 1]: Gracefully skip Pytest if no tests folder exists to avoid Exit Code 5
        # --timeout: a hung test fails with the stack of the exact test that
        # blocked, instead of stalling the job until it is killed with no
        # attribution. 120s is well clear of the slowest legitimate test here
        # (the migration suite) while still catching a genuine deadlock or an
        # unbounded retry loop quickly.
        # --timeout-method=thread: the default (SIGALRM) cannot interrupt a
        # coroutine parked in await, which is precisely the failure mode this
        # is here to catch.
        run: |
          if [ -d "tests" ]; then
            pytest --cov=. --cov-report=xml --timeout=120 --timeout-method=thread
          else
            echo "No tests folder found. Skipping pytest to avoid fatal exit code 5."
          fi

      - name: Run Writing golden evaluation
        if: matrix.service == 'writing' && vars.RUN_WRITING_EVAL == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_WRITING_EVAL: "1"
          PYTHONPATH: ${{ github.workspace }}/packages/contracts/py:${{ github.workspace }}/packages/security/py:${{ github.workspace }}/packages/pricing/py
        run: pytest tests/evaluation -m evaluation -q

      ####################################################
      # NODE
      ####################################################

      - name: Setup Node
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        if: matrix.language == 'node'
        run: npm ci

      - name: ESLint
        if: matrix.language == 'node'
        continue-on-error: true
        run: npm run lint

      - name: Run Jest with Coverage
        if: matrix.language == 'node'
        env:
          DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
          REDIS_URL: redis://127.0.0.1:6379/0
        # [RESILIENCE FIX 2]: Add --passWithNoTests to prevent Jest from crashing on empty test suites
        run: npm run test:cov -- --runInBand --forceExit --passWithNoTests

      ####################################################
      # Upload Coverage
      ####################################################

      - name: Upload Coverage
        if: matrix.language != 'go'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/coverage
            services/${{ matrix.service }}/coverage.xml

  ####################################################
  # GOA-030 — Playwright
  #
  # Runs the MOCKED suite (services/frontend/test/e2e) only.
  #
  # The live journey suite (test/journeys) is deliberately not here. It needs the
  # whole docker-compose stack, an Ollama embedding model on the host, a funded
  # LLM key and several minutes per run -- and its assertions are about ingested
  # catalogue data, which a CI runner does not have. Running it here would either
  # fail for reasons unrelated to the change under review, or be weakened until
  # it asserted nothing. It is a manual / workflow_dispatch gate instead; see
  # services/frontend/test/journeys/README.md.
  #
  # This is a documented deviation from GOA-030's "All journeys pass in CI
  # against staging environment": there is no staging environment. GOA-021 never
  # received AWS credentials and deploy-staging.yml has been paused since
  # 2026-07-27.
  ####################################################
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.matrix, 'frontend')
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      # Four workers against a production build, matching how the suite is run
      # locally. The config builds and serves rather than using `next dev`
      # because a dev server compiles routes on first request, and under
      # parallel workers that returns 404s for routes that exist -- the
      # 2026-08-09 audit recorded 56 failures from exactly that.
      - name: Playwright (mocked suite)
        run: npx playwright test --workers=4
        env:
          NEXT_PUBLIC_BILLING_ENABLED: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            services/frontend/playwright-report
            services/frontend/test-results
          retention-days: 7
