# -----------------------------------------------------------------------------
# GOA-022: caller workflow for the orchestration service.
#
# All the deployment logic lives in deploy-template.yml; this file only says
# which service to deploy and when. Copy it verbatim for a new service and
# change the four `with:` values.
# -----------------------------------------------------------------------------

name: Deploy Orchestration to Staging

on:
  push:
    branches:
      - dev
    paths:
      - services/orchestration/**
      - packages/security/py/**
      - .github/workflows/deploy-orchestration.yml
      - .github/workflows/deploy-template.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

# GOA-022 (N2): serialise deploys per service. Two merges to dev in quick
# succession would otherwise race on task-definition revisions and the older
# build can win, leaving stale code running with a green tick.
#
# cancel-in-progress is deliberately false: cancelling a run mid-deploy does
# not stop ECS, it just discards the stability wait, so the workflow would go
# green while a possibly-broken deployment continues unwatched.
concurrency:
  group: deploy-staging-orchestration
  cancel-in-progress: false

jobs:
  deploy:
    # GOA-022 (B2): the staging infrastructure has never been terraform
    # applied, so without this guard every push to dev fails at the OIDC step
    # with "Not authorized to perform sts:AssumeRoleWithWebIdentity" -- the
    # exact failure that got the previous deploy-staging.yml paused.
    #
    # TO ENABLE: apply the staging Terraform, set AWS_ROLE_TO_ASSUME to the
    # staging_deploy_role_arn output, then set STAGING_INFRA_READY to "true"
    # under Settings > Secrets and variables > Actions > Variables.
    #
    # Do NOT work around a failing OIDC step by adding static AWS access keys.
    # OIDC issues short-lived, repo-scoped credentials specifically so that no
    # long-lived secret sits in GitHub.
    if: vars.STAGING_INFRA_READY == 'true'
    uses: ./.github/workflows/deploy-template.yml
    with:
      service_path: services/orchestration
      # GOA-034: the Dockerfile copies packages/security/py, which a
      # context of services/orchestration cannot see.
      build_context: .
      ecr_repository: goa-staging-orchestration
      ecs_service: goa-staging-orchestration
      container_name: orchestration
