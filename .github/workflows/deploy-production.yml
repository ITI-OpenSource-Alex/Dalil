name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # PLACEHOLDER: Whoever runs the Terraform will replace this placeholder ARN
  ROLE_TO_ASSUME: arn:aws:iam::REPLACE_WITH_YOUR_AWS_ACCOUNT_ID:role/goa-production-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production # Targets the GitHub environment gate with manual reviewer rules

    steps:
      - uses: actions/checkout@v4

      - name: Display deployment info
        run: echo "Deploying to PRODUCTION"

      # CHANGE 2: Configured the dynamic AWS credentials action using OIDC
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

