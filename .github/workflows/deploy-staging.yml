name: Deploy Staging

on:
  push:
    branches:
      - dev
  # Lets you run this by hand once the infrastructure exists, rather than
  # waiting for the next push to dev.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  # After running `terraform apply`, replace with output value of staging_deploy_role_arn
  ROLE_TO_ASSUME: arn:aws:iam::114403655381:role/goa-staging-deploy

jobs:
  deploy:
    # ---------------------------------------------------------------------
    # PAUSED 2026-07-27 — re-enable during Sprint 4, with GOA-037 / GOA-080.
    #
    # TO TURN BACK ON: set the repository variable STAGING_INFRA_READY to
    # "true" (Settings -> Secrets and variables -> Actions -> Variables).
    # No code change needed — this line already reads it.
    #
    # WHY IT IS OFF: the job failed every push to dev with
    #   "Could not assume role with OIDC: Not authorized to perform
    #    sts:AssumeRoleWithWebIdentity"
    # which is not a bug in this workflow. The role in ROLE_TO_ASSUME below
    # does not exist yet — see the comment on that line: it is meant to come
    # from `terraform apply`, and the Terraform has never been applied. The
    # job was pointing at infrastructure nobody had created, and failing
    # loudly on every merge.
    #
    # DO NOT "fix" THIS BY ADDING AWS ACCESS KEYS. OIDC hands out short-lived,
    # repo-scoped credentials precisely so no long-lived secret sits in GitHub.
    # Swapping to static keys to make the red X go away would be a real
    # security downgrade in the same sprint as the OWASP hardening ticket.
    #
    # BEFORE RE-ENABLING, the AWS side needs both of:
    #   1. An OIDC identity provider for token.actions.githubusercontent.com
    #      with audience sts.amazonaws.com.
    #   2. The goa-staging-deploy role, trusting that provider with a
    #      condition on sub = repo:ITI-OpenSource-Alex/GOA:*  — keep that
    #      condition, or any repo on GitHub can assume the role.
    # ---------------------------------------------------------------------
    if: vars.STAGING_INFRA_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # TODO (GOA-070): Uncomment once ECS cluster and ECR repos exist
      # - name: Login to Amazon ECR
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # - name: Deploy to ECS
      #   run: aws ecs update-service --cluster goa-staging --service goa-gateway --force-new-deployment
