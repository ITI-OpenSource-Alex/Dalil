# -----------------------------------------------------------------------------
# GOA-022: reusable staging deployment pipeline.
#
# Callers pass the four things that differ per service; everything else
# (region, role, cluster) comes from repository variables so a new service is
# a five-line caller workflow.
#
# Action versions are pinned to full commit SHAs (GOA-022 N1): this job holds
# `id-token: write` and can push to ECR, so a compromised mutable tag such as
# @v4 would be an AWS-account-level event. Bump these with Dependabot, which
# understands the trailing version comment.
# -----------------------------------------------------------------------------

name: Deploy Service to Staging

on:
  workflow_call:
    inputs:
      service_path:
        description: Repository path containing the service Dockerfile
        required: true
        type: string
      ecr_repository:
        description: ECR repository name
        required: true
        type: string
      ecs_service:
        description: ECS service name
        required: true
        type: string
      container_name:
        description: ECS container name to update
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  # GOA-022 AC: "Deploy notifications: GitHub commit status updated with
  # deploy result". Reusable workflows cannot grant themselves permissions
  # the caller did not have, so every caller declares this too.
  statuses: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'goa-staging' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.ecr_repository }}
    runs-on: ubuntu-latest

    # GOA-022 (B6): 30 minutes, not 10. A cold Docker build for a Python
    # service runs 3-6 minutes and the stability wait below is allowed 15, so
    # the old 10-minute cap could kill the job mid-rollback. When GitHub
    # cancels the job ECS keeps deploying, so the run reports "cancelled"
    # while the circuit breaker is still rolling back and nobody can tell what
    # is actually running.
    timeout-minutes: 30

    env:
      # Shared by both commit-status steps so the context string cannot drift
      # between the pending and final report.
      STATUS_CONTEXT: deploy/staging/${{ inputs.ecs_service }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # GOA-022 (B2): fail with an actionable message rather than letting
      # configure-aws-credentials fail on an empty role ARN. An unset
      # repository variable resolves to "" here, and ${VAR:?} catches empty as
      # well as unset.
      - name: Assert deploy configuration is present
        run: |
          set -euo pipefail
          : "${AWS_ROLE_TO_ASSUME:?Repository variable AWS_ROLE_TO_ASSUME is not set. Run 'terraform output staging_deploy_role_arn' and set it under Settings > Secrets and variables > Actions > Variables.}"
          : "${AWS_REGION:?Repository variable AWS_REGION resolved empty.}"
          : "${ECS_CLUSTER:?Repository variable ECS_CLUSTER resolved empty.}"
          echo "Cluster : $ECS_CLUSTER"
          echo "Region  : $AWS_REGION"
          echo "Service : ${{ inputs.ecs_service }}"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Marks the commit as deploying before the slow work starts, so the
      # commit view shows an in-flight deploy rather than nothing at all.
      - name: Mark commit status pending
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" \
            -f description="Deploying ${{ inputs.ecr_repository }} to staging..." \
            --silent

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: goa-staging-${{ github.run_id }}
          # Long enough for a cold build plus the stability wait, short enough
          # that a leaked credential expires before it is useful.
          role-duration-seconds: 2700
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # GOA-022 (N5): buildx enables the GitHub Actions layer cache below.
      # Registry-backed caching is not an option here because ECR repositories
      # are IMMUTABLE (N7) and a `buildcache` tag has to be overwritten.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image reference
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # GOA-022 (N7): with IMMUTABLE tags, pushing a SHA that is already in ECR
      # fails. Re-running a deploy for the same commit is a legitimate thing to
      # want (a stuck service, a rolled-back revision), so detect the existing
      # image and reuse it instead of rebuilding.
      - name: Check whether the image tag already exists
        id: existing
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --output json >/dev/null 2>&1; then
            echo "::notice::${ECR_REPOSITORY}:${IMAGE_TAG} is already in ECR; skipping build and reusing it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.service_path }}
          file: ${{ inputs.service_path }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          # GOA-022 (N10): explicit, and it must match the task definition's
          # runtime_platform (cpu_architecture = "X86_64"). An arch mismatch
          # surfaces as tasks that fail to start and a circuit-breaker
          # rollback, which is miserable to debug from the ECS console.
          platforms: linux/amd64
          # GOA-022 (N5): GHA layer cache. `mode=max` caches intermediate
          # layers too, which is what makes multi-stage Python builds cheap.
          # Scoped per service so the nine services do not evict each other.
          cache-from: type=gha,scope=${{ inputs.ecr_repository }}
          cache-to: type=gha,mode=max,scope=${{ inputs.ecr_repository }}
          # Attestations turn the push into an OCI image index. ECS can pull
          # one, but it makes `describe-images` and manifest digests harder to
          # reason about for no benefit here.
          provenance: false
          sbom: false

      # GOA-022 (N3): describe-services returns exit 0 with a populated
      # failures[] for a service that does not exist, so the previous
      # `test -n "$arn"` guard exited 1 with no output at all. Every branch
      # below says what went wrong and which resource it was looking at.
      - name: Download active ECS task definition
        env:
          ECS_SERVICE: ${{ inputs.ecs_service }}
        run: |
          set -euo pipefail

          described="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)"

          failure_reason="$(jq -r '.failures[0].reason // empty' <<< "$described")"
          if [[ -n "$failure_reason" ]]; then
            echo "::error::ECS could not describe service '${ECS_SERVICE}' in cluster '${ECS_CLUSTER}': ${failure_reason}. Has terraform apply been run for this environment?"
            exit 1
          fi

          service="$(jq -c '.services[0] // empty' <<< "$described")"
          if [[ -z "$service" || "$service" == "null" ]]; then
            echo "::error::ECS returned no service named '${ECS_SERVICE}' in cluster '${ECS_CLUSTER}'."
            exit 1
          fi

          service_status="$(jq -r '.status // empty' <<< "$service")"
          if [[ "$service_status" != "ACTIVE" ]]; then
            echo "::error::ECS service '${ECS_SERVICE}' is '${service_status}', expected ACTIVE."
            exit 1
          fi

          task_definition_arn="$(jq -r '.taskDefinition // empty' <<< "$service")"
          if [[ -z "$task_definition_arn" ]]; then
            echo "::error::ECS service '${ECS_SERVICE}' has no task definition attached."
            exit 1
          fi

          # An automatic rollback on failed health checks is the entire point
          # of waiting for stability below. Without the circuit breaker a bad
          # image just sits there failing, so refuse to deploy rather than
          # deploy without a safety net.
          circuit_breaker_enabled="$(jq -r '.deploymentConfiguration.deploymentCircuitBreaker.enable // false' <<< "$service")"
          circuit_breaker_rollback="$(jq -r '.deploymentConfiguration.deploymentCircuitBreaker.rollback // false' <<< "$service")"
          if [[ "$circuit_breaker_enabled" != "true" || "$circuit_breaker_rollback" != "true" ]]; then
            echo "::error::ECS deployment circuit breaker with rollback must be enabled for '${ECS_SERVICE}' (enable=${circuit_breaker_enabled}, rollback=${circuit_breaker_rollback})."
            exit 1
          fi

          echo "Active task definition: ${task_definition_arn}"

          # GOA-022 (N4): --include TAGS. describe-task-definition omits tags
          # by default, and tags live alongside .taskDefinition rather than
          # inside it -- so the previous `--query taskDefinition` silently
          # dropped every tag Terraform had set, on every deploy. Merge them
          # back in; `tags` is a valid RegisterTaskDefinition field and the
          # deploy action passes it through.
          aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" \
            --include TAGS \
            --output json > described-task-definition.json

          jq '.taskDefinition + (if ((.tags // []) | length) > 0 then {tags: .tags} else {} end)' \
            described-task-definition.json > task-definition.json

          echo "Carried-over tags: $(jq -r '(.tags // []) | length' task-definition.json)"

      - name: Render new image into task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container_name }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy task definition and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ inputs.ecs_service }}
          # Blocks until ECS reports the deployment settled. If health checks
          # fail, the circuit breaker rolls back server-side and this step
          # fails the workflow -- which is how a bad deploy becomes a red run
          # instead of a silent outage.
          wait-for-service-stability: true
          # GOA-022 (B6): 15 minutes. The old 5 was shorter than a
          # circuit-breaker rollback on a service with a health-check grace
          # period, so a rolling-back deployment could report success.
          wait-for-minutes: 15

      # GOA-022 AC: commit status reflects the deploy result. `if: always()`
      # so a failed or rolled-back deploy reports failure rather than leaving
      # the commit stuck on pending forever.
      #
      # A failure here maps to the deploy action's own outcome, which is what
      # the circuit breaker drives: if ECS rolls back, wait-for-service-
      # stability fails, and this reports failure on the commit.
      - name: Report deploy result to commit status
        if: always()
        run: |
          set -euo pipefail

          case "${{ job.status }}" in
            success)   state=success; description="Deployed ${{ inputs.ecr_repository }} to staging" ;;
            cancelled) state=error;   description="Deploy cancelled - ECS may still be deploying" ;;
            *)         state=failure; description="Deploy failed or was rolled back by ECS" ;;
          esac

          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" \
            -f description="$description" \
            --silent

          echo "Commit status '$STATUS_CONTEXT' set to '$state'."

      - name: Report deployed image
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Staging deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Service | \`${{ inputs.ecs_service }}\` |"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Image | \`${{ steps.image.outputs.image }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image reused | \`${{ steps.existing.outputs.exists }}\` |"
            echo "| Result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
