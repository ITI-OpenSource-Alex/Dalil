name: Writing Golden Evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: Run 20 paid Claude criterion evaluations
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golden-accuracy:
    if: inputs.confirm_paid_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/writing
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_WRITING_EVAL: "1"
      WRITING_MODEL: ${{ vars.WRITING_MODEL || 'claude-sonnet-4-6' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/writing/requirements.txt

      - name: Require Anthropic secret
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Repository secret ANTHROPIC_API_KEY is required." >&2
            exit 1
          fi

      - name: Install Writing dependencies
        run: pip install -r requirements.txt

      - name: Enforce golden accuracy above 80 percent
        run: pytest tests/evaluation -m evaluation -q -s
