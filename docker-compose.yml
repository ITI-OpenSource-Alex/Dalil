services:
  gateway:
    build:
      context: ./services/gateway
      target: dev

    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://goa:goa_pass@postgres:5432/gateway_db?sslmode=disable
      - REDIS_URL=redis://redis-gateway:6379/0
      - JWT_SECRET=supersecret_dev_key
    volumes:
      - ./services/gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: goa
      POSTGRES_PASSWORD: goa_pass
      # We will mount an init script later to create the 5 separate databases
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U goa" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-gateway:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack
    environment:
      - SERVICES=sqs,s3
    ports:
      - "4566:4566"

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
  grafana-data:
