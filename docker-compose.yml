services:
  gateway:
    build:
      context: ./services/gateway
      target: dev

    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://goa:goa_pass@postgres:5432/gateway_db?sslmode=disable
      - REDIS_URL=redis://redis-gateway:6379/0
      - JWT_SECRET=supersecret_dev_key
    volumes:
      - ./services/gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: goa
      POSTGRES_PASSWORD: goa_pass
      # We will mount an init script later to create the 5 separate databases
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U goa" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-gateway:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack
    environment:
      - SERVICES=sqs,s3
    ports:
      - "4566:4566"

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  speaking:
    build:
      context: ./services/speaking
      target: dev
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - MAX_CONNECTIONS=100
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - OTEL_SERVICE_NAME=speaking
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
    volumes:
      - ./services/speaking:/app
    depends_on:
      prometheus:
        condition: service_started

  rag:
    build:
      context: ./services/rag
      target: dev
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/rag_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
    volumes:
      - ./services/rag:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  grafana-data:
