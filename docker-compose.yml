services:
  gateway:
    build:
      context: ./services/gateway
      target: dev
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - INTERNAL_API_KEY=supersecret_internal_key_123
      - ADMIN_API_KEY=${ADMIN_API_KEY:-local_admin_key_123}
      - REDIS_URL=redis://redis-gateway:6379/0
      - JWT_SECRET=supersecret_dev_key
      - WRITING_SERVICE_URL=http://writing:8000
      - EXAM_SERVICE_URL=http://exam:8085
      - NOTIFICATION_SERVICE_URL=http://notification:8087
      - ORCHESTRATION_SERVICE_URL=http://orchestration:8083
      - SUBSCRIPTION_UPGRADE_URL=${SUBSCRIPTION_UPGRADE_URL:-http://localhost:3000/upgrade}
      - SUBSCRIPTION_CACHE_TTL=5m
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./services/gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
      writing:
        condition: service_healthy
      exam:
        condition: service_started

  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
      target: development
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=goa
      - DB_PASSWORD=goa_pass
      - DB_NAME=user_db
      - INTERNAL_API_KEY=supersecret_internal_key_123

      # AWS / LocalStack
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/user-events

      - REDIS_HOST=redis-gateway
      - REDIS_PORT=6379

    volumes:
      - ./services/user:/usr/src/app
      - /usr/src/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  writing:
    build:
      context: .
      dockerfile: services/writing/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/writing_db
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=goa-writing-files
      - CV_UPLOADED_QUEUE_URL=http://localstack:4566/000000000000/goa-cv-uploaded
      - CV_PROCESSED_QUEUE_URL=http://localstack:4566/000000000000/goa-cv-processed
      - PYTHONPATH=/app:/packages/contracts/py
      - OTEL_SERVICE_NAME=writing-service
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - WRITING_MODEL=${WRITING_MODEL:-claude-sonnet-4-6}
      # AgentRouter serves no channel for haiku ("无可用渠道" / 503), only
      # claude-opus-4-8. Revert to a cheaper model if the gateway ever routes one.
      - CV_EXTRACTION_MODEL=${CV_EXTRACTION_MODEL:-claude-opus-4-8}
      - ANTHROPIC_TIMEOUT_SECONDS=${ANTHROPIC_TIMEOUT_SECONDS:-25}
      - WRITING_CACHE_VERSION=${WRITING_CACHE_VERSION:-v1}
    volumes:
      - ./services/writing/app:/app/app
      - ./services/writing/cv_processor:/app/cv_processor
      - ./services/writing/migrations:/app/migrations
      - ./services/writing/tests:/app/tests
      - ./packages/contracts/py:/packages/contracts/py
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10

  cv-processor:
    build:
      context: .
      dockerfile: services/writing/Dockerfile
    command: [ "sh", "-c", "python -m app.init_db && python -m cv_processor.local_worker" ]
    environment:
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/writing_db
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=goa-writing-files
      - CV_PROCESSOR_QUEUE_URL=http://localstack:4566/000000000000/goa-cv-processing
      - CV_PROCESSED_QUEUE_URL=http://localstack:4566/000000000000/goa-cv-processed
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # The CV processor is an AI service like any other and must reach the same
      # gateway. Without these two it fell back to the real Anthropic API with an
      # empty key and every CV stayed stuck in `processing` (BUG-018).
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      # AgentRouter serves no channel for haiku ("无可用渠道" / 503), only
      # claude-opus-4-8. Revert to a cheaper model if the gateway ever routes one.
      - CV_EXTRACTION_MODEL=${CV_EXTRACTION_MODEL:-claude-opus-4-8}
      - ANTHROPIC_TIMEOUT_SECONDS=${ANTHROPIC_TIMEOUT_SECONDS:-25}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - PYTHONPATH=/app:/packages/contracts/py
      - OTEL_SERVICE_NAME=cv-processor
    volumes:
      - ./services/writing/app:/app/app
      - ./services/writing/cv_processor:/app/cv_processor
      - ./services/writing/migrations:/app/migrations
      - ./packages/contracts/py:/packages/contracts/py
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
      target: dev
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/notification_db
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      # Both queues the Lambda is subscribed to in AWS. notification-queue
      # carries ScholarshipMatched and DEADLINE_REMINDER from the scholarship
      # matcher; goa-cv-processed carries CVProcessed from the Writing service.
      # In AWS these are two event source mappings; locally the poller in
      # src/local-server.ts watches both.
      - NOTIFICATION_QUEUE_URLS=http://localstack:4566/000000000000/notification-queue,http://localstack:4566/000000000000/goa-cv-processed
      # Events carry no email address, so the recipient is resolved from the
      # User service. Without these the handler cannot send anything, which is
      # deliberate -- see src/users.ts.
      - USER_SERVICE_URL=http://user-service:8081
      - INTERNAL_API_KEY=supersecret_internal_key_123
      # LocalStack's SES accepts and stores without delivering, so any address
      # works locally. In AWS this must be an identity verified in SES.
      - SES_SENDER_ADDRESS=${SES_SENDER_ADDRESS:-notifications@localhost.test}
      - OTEL_SERVICE_NAME=notification
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: goa
      POSTGRES_PASSWORD: goa_pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U goa -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-gateway:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    build:
      context: ./infra/localstack
    image: goa-localstack:3.4.0
    environment:
      # ses added for GOA-023: the notification service sends email through it.
      # LocalStack accepts and stores messages without delivering, which is what
      # makes the notification E2E runnable locally at zero cost.
      - SERVICES=sqs,s3,ses
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: [ "CMD-SHELL", "awslocal s3api head-bucket --bucket goa-writing-files" ]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/gateway-alerts.yml:/etc/prometheus/gateway-alerts.yml
      - ./monitoring/prometheus/writing-alerts.yml:/etc/prometheus/writing-alerts.yml

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  speaking:
    build:
      context: ./services/speaking
      target: dev
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - MAX_CONNECTIONS=100
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
      - SPEAKING_PRACTICE_MODEL=${SPEAKING_PRACTICE_MODEL:-claude-opus-4-8}
      - SPEAKING_EXAM_MODEL=${SPEAKING_EXAM_MODEL:-claude-opus-4-8}
      - OTEL_SERVICE_NAME=speaking
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - SPEECH_SERVICE_URL=http://speech:8086
    volumes:
      - ./services/speaking:/app
    depends_on:
      prometheus:
        condition: service_started
      # The service pings speaking_db during startup and calls log.Fatal on
      # failure, so a cold `docker compose up` raced Postgres and exited 1
      # with "the database system is starting up (SQLSTATE 57P03)". air only
      # rebuilds on file change, so it never retried and the container sat
      # "Up" with no server listening.
      postgres:
        condition: service_healthy

  rag:
    build:
      context: ./services/rag
      target: dev
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/rag_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - REDIS_URL=redis://redis-cache:6379/2
      - USER_SERVICE_URL=http://user-service:8081
      - WRITING_SERVICE_URL=http://writing:8000
      - INTERNAL_API_KEY=supersecret_internal_key_123
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_NAME=user-events
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-ollama}
    volumes:
      - ./services/rag:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_started

  exam:
    build:
      context: ./services/exam
      target: dev
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/exam_db
      - INTERNAL_API_KEY=supersecret_internal_key_123
      - WATCHFILES_FORCE_POLLING=true
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - WRITING_SERVICE_URL=http://writing:8000
      - SPEAKING_SERVICE_URL=http://speaking:8082
      - AWS_REGION=us-east-1
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=goa-exam-audio
    volumes:
      - ./services/exam:/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  orchestration:
    build:
      context: ./services/orchestration
      target: dev
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/orchestration_db
      - REDIS_URL=redis://redis-cache:6379/1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
      - INTERNAL_API_KEY=supersecret_internal_key_123
      # Browser-facing URLs. The *_SERVICE_URL values above are Docker
      # hostnames for server-to-server calls; handing them to a client gave
      # ws://speaking:8082 and http://writing:8000, which no browser resolves
      # (BUG-016). Writing's SSE now goes via the Gateway; Speaking's socket
      # is still direct until the Gateway has a WS proxy.
      - PUBLIC_GATEWAY_URL=${PUBLIC_GATEWAY_URL:-http://localhost:8080}
      - PUBLIC_SPEAKING_WS_URL=${PUBLIC_SPEAKING_WS_URL:-ws://localhost:8082/ws}
      - OTEL_SERVICE_NAME=orchestration
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - RAG_SERVICE_URL=http://rag:8084
      - SPEAKING_SERVICE_URL=http://speaking:8082
      - WRITING_SERVICE_URL=http://writing:8000
    volumes:
      - ./services/orchestration:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_started

  speech:
    build:
      context: ./services/speech
    ports:
      - "8086:8086"
    environment:
      - PORT=8086

  ingestion:
    profiles: ["ingestion"]
    build:
      # Repo-root context: the Dockerfile copies packages/contracts/py, which the
      # scholarship matcher imports. A context of ./services/ingestion cannot see
      # it, and the worker fails with ModuleNotFoundError inside the image.
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      - RAG_SERVICE_URL=http://rag:8084
      - INTERNAL_API_KEY=supersecret_internal_key_123
      - DRY_RUN=false
      - INGESTION_DATABASE_URL=postgresql://goa:goa_pass@postgres:5432/ingestion_db
      # GOA-123: the visa adapter's LLM extraction runs here. Without these the
      # container fell back to api.anthropic.com with no key -> 401 on every source.
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_USER_AGENT=${ANTHROPIC_USER_AGENT:-}
      - EXTRACTION_MODEL=${EXTRACTION_MODEL:-claude-opus-4-8}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      # ING-02's completion report goes to LocalStack. Without an explicit endpoint
      # boto3 resolves to real AWS and the report silently never lands.
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - INGESTION_REPORTS_BUCKET=goa-ingestion-reports
    volumes:
      - ./services/ingestion:/app
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started

volumes:
  pgdata:
  grafana-data:
