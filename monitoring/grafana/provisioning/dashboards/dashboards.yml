apiVersion: 1

# Grafana held zero dashboards (BUG-033). The Prometheus datasource was
# provisioned and working and real data was being collected -- only the
# visualisation layer was missing, so OBS-03 had no panels to populate.
#
# docker-compose mounts monitoring/grafana/provisioning as
# /etc/grafana/provisioning, so anything added here loads on startup with no
# compose change.
providers:
  - name: goa
    orgId: 1
    folder: GOA
    type: file
    # Let dashboards be edited in the UI for exploration, but the files on disk
    # remain the source of truth and are re-read every 30s.
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
