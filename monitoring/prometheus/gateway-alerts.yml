groups:
  - name: gateway.rules
    rules:
      - alert: GatewayHighAuthFailures
        expr: increase(goa_gateway_auth_failures_total[1m]) > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Gateway auth failures exceeded 50 per minute.
          description: The gateway auth failure counter is above the GOA-003 expected threshold.
