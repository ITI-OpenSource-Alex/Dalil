global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/gateway-alerts.yml

scrape_configs: 
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
  - job_name: 'rag'
    static_configs:
      - targets: ['rag:8084']
  - job_name: 'orchestration'
    static_configs:
      - targets: ['orchestration:8083']
  - job_name: 'speaking'
    static_configs:
      - targets: ['speaking:8082']
