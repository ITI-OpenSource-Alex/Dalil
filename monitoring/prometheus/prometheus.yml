global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/gateway-alerts.yml
  - /etc/prometheus/writing-alerts.yml

scrape_configs: 
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
  - job_name: 'rag'
    static_configs:
      - targets: ['rag:8084']
  - job_name: 'orchestration'
    static_configs:
      - targets: ['orchestration:8083']
  - job_name: 'speaking'
    static_configs:
      - targets: ['speaking:8082']
  - job_name: 'writing'
    metrics_path: /metrics
    static_configs:
      - targets: ['writing:8000']
  # Exam has always exposed /metrics and was never scraped, so
  # goa_exam_sessions_total, the reading-session counters, grading latency and
  # the score histograms were produced and collected by nobody (BUG-034).
  # GOA-100's EXM-12 asserts on exactly those, and GOA-066 builds on them.
  - job_name: 'exam'
    static_configs:
      - targets: ['exam:8085']
  # GOA-030. The E2E journey suite pushes goa_e2e_step_duration_ms{journey,step}
  # here, because a Playwright run finishes long before a 15-second scrape could
  # reach it directly.
  #
  # honor_labels is required rather than cosmetic: without it Prometheus
  # overwrites the pushed `job` and `instance` labels with this scrape job's
  # own, and every journey's step timings collapse into one series.
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
