groups:
  - name: writing.rules
    rules:
      - record: goa_writing:evaluation_latency_p95_ms:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(goa_writing_evaluation_latency_ms_bucket[5m])))

      - alert: WritingEvaluationP95LatencyHigh
        expr: goa_writing:evaluation_latency_p95_ms:5m > 30000
        for: 5m
        labels:
          severity: warning
          service: writing
          slo: evaluation-latency
        annotations:
          summary: Writing evaluation P95 latency exceeds 30 seconds
          description: The five-minute P95 of full Writing swarm evaluations is {{ $value }} ms, above the 30000 ms target.

      - alert: WritingMetricsTargetDown
        expr: up{job="writing"} == 0
        for: 2m
        labels:
          severity: critical
          service: writing
        annotations:
          summary: Prometheus cannot scrape the Writing service
          description: The Writing metrics target has been unavailable for at least two minutes.
