# Repo-root pytest configuration.
#
# GOA-030: exists to make `pytest evals/tests/` work, which it did not.
#
# The eval modules do `from evals.providers.base import ...` and
# `from evals import rag_benchmark`. For that to resolve, the repo root has to
# be on sys.path -- and with pytest's default `prepend` import mode it is not:
# pytest inserts the first parent directory WITHOUT an `__init__.py`, which for
# evals/tests/test_x.py is `evals/tests` itself. Neither `evals/` nor
# `evals/tests/` is a package, so the repo root never gets added.
#
# Why it looked like it worked locally: `python -m pytest` puts the current
# directory on sys.path (the `-m` flag does that, not pytest), so a developer
# running it that way sees all 247 tests collect. CI runs the `pytest` console
# script, which does not, and gets ModuleNotFoundError on exactly three modules.
# Same tree, same command arguments, different result -- which is why this
# survived: it is invisible from the way people run it by hand.
#
# `pythonpath` is the supported fix (pytest 7+; CI is on 9.1.1) and is
# preferred over adding __init__.py files to evals/, which would change how
# those modules are imported everywhere else, or over a root conftest.py, which
# would fix it as a side effect of an empty file and explain nothing.
#
# Scope: this only applies when rootdir resolves here. Each service under
# services/ has its own pytest.ini and is unaffected -- verified by re-running
# the writing suite after adding this.
[pytest]
pythonpath = .
