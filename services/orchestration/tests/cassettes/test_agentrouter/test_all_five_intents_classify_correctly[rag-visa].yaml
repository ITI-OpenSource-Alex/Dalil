      student visa?"}],"model":"claude-opus-4-8","system":"You are a routing agent.
      Classify the user message into exactly one of:\n                        SPEAKING  -
      IELTS speaking practice or mock interview (e.g. \"I want to practice speaking\")\n                        WRITING   -
      essay submission or writing evaluation (e.g. \"Score my essay please\")\n                        RAG       -
